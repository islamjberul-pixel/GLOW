name: Build GLOW FIRST APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-36.1
            platforms;android-36
            build-tools;36.0.0

      - name: Ensure Android SDK licenses are accepted
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure gradlew is present and executable
        run: |
          if [ ! -f gradlew ] && command -v gradle >/dev/null 2>&1; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Restore or generate debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify generated APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v7
        with:
          name: glow-first-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Determine Release Tag and Title
        id: release_meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "title=GLOW FIRST ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.0.0" >> "$GITHUB_OUTPUT"
            echo "title=GLOW FIRST v1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release and Attach APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          body: |
            Automated build of **GLOW FIRST** Android Gaming Macro (`app-debug.apk`).
            Download the APK below and install it on your Android device (Android 7.0+ / optimized for Android 11 Nokia C30).
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
